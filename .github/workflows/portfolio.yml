name: Portfolio / Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type check and build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Save generated CV for PDF visual QA
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-cv-proof
          path: public/cv/Samandar_Alimov_CV.pdf
          if-no-files-found: error
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  visual-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser interaction and responsive checks
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Save visual QA snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa
          path: |
            screenshots/
            test-results/
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
